<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papers</title>
<meta name="description" content="Review notes on major papers, organized by topic. Open an entry and try to state the setting, the result and the proof idea before revealing them.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Papers">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F0E8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1218">
<link rel="stylesheet" href="./katex/katex.min.css">
<style>
:root{
  color-scheme:light;
  --bg:#F3F0E8; --card:#FCFAF5; --ink:#1B1A17; --ink2:#44413B; --muted:#6F6A60; --line:#DDD6C8; --soft:#ECE7DC;
  --accent:#2F4C7E; --accent-ink:#F6F3EC;
  --serif:ui-serif,"New York","Iowan Old Style",Charter,"Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0F1218; --card:#161B24; --ink:#E9E5DC; --ink2:#C9C3B7; --muted:#8F897D; --line:#2A3140; --soft:#1E2531;
  --accent:#9DB8E6; --accent-ink:#0F1218;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;font-family:var(--sans)}
header.top .brand{display:inline-block;font-family:var(--serif);font-weight:600;font-size:18px;color:var(--ink);letter-spacing:.01em}
main{max-width:640px;margin:0 auto;padding:18px 16px 0}

.lede{font-family:var(--sans);font-size:14px;color:var(--muted);margin:2px 0 14px}
.search{width:100%;font-family:var(--sans);font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;margin-bottom:16px}
.search:focus{border-color:var(--accent)}
.empty{font-family:var(--sans);color:var(--muted);font-size:15px}

ul.topics{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
ul.topics li+li{border-top:1px solid var(--line)}
ul.topics a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;color:var(--ink);min-height:52px}
.t-name{font-size:19px;font-weight:600}
.t-count{font-family:var(--sans);font-size:13px;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 9px}

.crumbs{font-family:var(--sans);font-size:13px;color:var(--muted);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}
.crumbs .sep{color:var(--line)}
h1.topic-title,h1.entry-title{font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:0 0 12px}
h1.topic-title{font-size:28px}
h1.entry-title{font-size:26px;margin-bottom:14px}
.blurb{color:var(--ink2);font-size:16.5px;margin:0 0 18px}
.blurb p{margin:0 0 10px}

ol.entries,ul.entries{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;counter-reset:n}
.entries li+li{border-top:1px solid var(--line)}
.entries a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px;color:var(--ink);min-height:50px}
ol.entries a::before{counter-increment:n;content:counter(n);font-family:var(--sans);font-size:12px;color:var(--muted);min-width:1.4em;align-self:center}
.e-title{flex:1;font-size:17.5px;font-weight:500}
.e-years{font-family:var(--sans);font-size:13px;color:var(--muted);white-space:nowrap}
.actions{margin:16px 0 0;font-family:var(--sans)}
.btn{display:inline-block;font-family:var(--sans);font-size:14px;font-weight:500;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--sans);margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:2px}
.seg button{font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;color:var(--muted);min-height:30px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.ghost{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--accent);padding:6px 4px;min-height:30px}

.card{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:2px 16px}
.slot+.slot{border-top:1px solid var(--line)}
.slot-h{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  padding:14px 0;min-height:46px}
.slot.open .slot-h{color:var(--accent)}
.chev{width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .18s ease;margin-right:3px}
.slot.open .chev{transform:rotate(45deg)}
.slot-b{display:none;padding:0 0 16px}
.slot.open .slot-b{display:block}
.slot-b p{margin:0 0 11px}
.slot-b p:last-child,.slot-b ul:last-child,.slot-b .math:last-child{margin-bottom:0}
.slot-b ul{margin:0 0 11px;padding-left:20px}
.slot-b li{margin:0 0 6px}
.slot-b .math{margin:4px 0 12px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.slot-b .katex-display{margin:.4em 0}
.slot-b .katex{font-size:1.02em}
.xref{border-bottom:1px solid currentColor;padding-bottom:0}

.pager{display:flex;justify-content:space-between;gap:12px;margin:20px 0 0;font-size:15px}
.pager a{display:flex;flex-direction:column;max-width:48%;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.pager a.next{text-align:right;margin-left:auto}
.pager .dir{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.err{font-family:var(--sans);color:#B93434}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#/">Papers</a></header>
<main id="app"><p class="lede">Loading…</p></main>
<script src="./katex/katex.min.js"></script>
<script src="./katex/auto-render.min.js"></script>
<script src="./app.js"></script>
<script>
if (navigator.serviceWorker) addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
</script>
</body>
</html>
