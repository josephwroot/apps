<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joe's apps</title>
<style>
:root{--bg:#ECEFF5;--fg:#131A2A;--muted:#566178;--card:#FFFFFF;--line:#CDD4E0;--brass:#E3A81F}
@media (prefers-color-scheme:dark){:root{--bg:#0C111D;--fg:#EDF0F7;--muted:#9AA5BD;--card:#151C2D;--line:#2A344E;--brass:#F0B93A;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin-inline:auto;padding:40px 20px}
h1{font-size:22px;margin:0 0 20px}
a.app{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;text-decoration:none}
a.app img{width:56px;height:56px;border-radius:12px}
a.app b{display:block;font-size:17px}
a.app span{color:var(--muted);font-size:14px}
p{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Joe's apps</h1>
<a class="app" href="./clef-climb/"><img src="./clef-climb/icons/icon-192.png" alt=""><div><b>Clef Climb</b><span>Read notes on the staff by playing them on a piano.</span></div></a>
<p>Open an app in Safari, then Share → Add to Home Screen to install it.</p>
</main>
</body>
</html>
